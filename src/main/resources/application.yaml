spring:
  application:
    name: SpringSocks

  client:
    warehouse:
      url: ${WAREHOUSE_HISTORY_URL}

  datasource:
    url: ${DB_URI}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:/db/changelog/db.changelog.yaml
    enabled: true
    drop-first: false
    default-schema: public

server:
  port: 3000